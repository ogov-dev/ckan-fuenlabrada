---
# Escenario de prueba: dos instancias independientes en el Docker local.
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3
    ckan_image: ogov/ckan:baseline
    ckan_image_pull: false
    ckan_baseline_dir: /baseline
    ckan_base_dir: "{{ lookup('env', 'OGOV_TEST_DEPLOY_DIR') }}"
    ckan_health_host: host.docker.internal
    ckan_sysadmin_email: admin@example.org
  children:
    ckan_instances:
      hosts:
        prueba-a:
          ckan_instance_name: ogov-prueba-a
          ckan_http_port: 8091
          ckan_site_url: http://localhost:8091
          ckan_site_title: Instancia de prueba A
          ckan_site_id: prueba-a
          ckan_dir3_code: L01000001
        prueba-b:
          ckan_instance_name: ogov-prueba-b
          ckan_http_port: 8092
          ckan_site_url: http://localhost:8092
          ckan_site_title: "Instancia B #2 $x prueba"
          ckan_site_id: prueba-b
          ckan_dir3_code: L01000002
