# Configuración de pruebas: hereda la de tests de CKAN y apunta a los
# servicios de docker-compose.test.yml. Solo para la etapa "test".
[app:main]
use = config:/srv/app/src/ckan/test-core.ini

sqlalchemy.url = postgresql://ckan_default:pass@db/ckan_test
ckan.datastore.write_url = postgresql://ckan_default:pass@db/datastore_test
ckan.datastore.read_url = postgresql://datastore_default:pass@db/datastore_test
solr_url = http://solr:8983/solr/ckan
ckan.redis.url = redis://redis:6379/1
ckan.site_url = http://test.ckan.net

# Misma configuración común que la imagen (Dockerfile)
ckan.plugins = ogovtech_theme ogovtech_fixes dcat scheming_datasets
ckan.locale_default = es
licenses_group_url = file:///srv/app/src/ckanext-ogovtech_fixes/ckanext/ogovtech_fixes/schemas/licenses.json
scheming.dataset_schemas = ckanext.ogovtech_fixes:schemas/dataset.yaml
scheming.presets = ckanext.scheming:presets.json ckanext.dcat.schemas:presets.yaml
scheming.dataset_fallback = false
ckanext.dcat.rdf.profiles = euro_dcat_ap_2 euro_dcat_ap_scheming dcat_ap_es
ckanext.dcat.resource.inherit.license = true
ckanext.ogovtech.dir3_code = L01289999
ckanext.ogovtech.spatial_uri = http://datos.gob.es/recurso/sector-publico/territorio/Provincia/Madrid
ckanext.ogovtech.catalog_issued = 2026-01-01

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
