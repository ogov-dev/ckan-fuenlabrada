name: ${COMPOSE_PROJECT_NAME:-ogov-ckan}

x-ckan-env: &ckan-env
  CKAN_SITE_URL: ${CKAN_SITE_URL:?Define CKAN_SITE_URL en .env}
  CKAN__SITE_TITLE: ${CKAN__SITE_TITLE}
  CKAN__SITE_ID: ${CKAN__SITE_ID}
  CKAN_SQLALCHEMY_URL: postgresql://${CKAN_DB_USER:?Define CKAN_DB_USER en .env}:${CKAN_DB_PASSWORD:?Define CKAN_DB_PASSWORD en .env}@db/${CKAN_DB:?Define CKAN_DB en .env}
  CKAN_DATASTORE_WRITE_URL: postgresql://${CKAN_DB_USER:?Define CKAN_DB_USER en .env}:${CKAN_DB_PASSWORD:?Define CKAN_DB_PASSWORD en .env}@db/${DATASTORE_DB:?Define DATASTORE_DB en .env}
  CKAN_DATASTORE_READ_URL: postgresql://${DATASTORE_READONLY_USER:?Define DATASTORE_READONLY_USER en .env}:${DATASTORE_READONLY_PASSWORD:?Define DATASTORE_READONLY_PASSWORD en .env}@db/${DATASTORE_DB:?Define DATASTORE_DB en .env}
  CKAN_SOLR_URL: http://solr:8983/solr/ckan
  CKAN_REDIS_URL: redis://redis:6379/1
  CKAN_SECRET_KEY: ${CKAN_SECRET_KEY:?Define CKAN_SECRET_KEY en .env}
  CKAN_JWT_SECRET: ${CKAN_JWT_SECRET:?Define CKAN_JWT_SECRET en .env}
  OGOV_ENV: ${OGOV_ENV:-production}
  CKAN_SYSADMIN_NAME: ${CKAN_SYSADMIN_NAME:?Define CKAN_SYSADMIN_NAME en .env}
  CKAN_SYSADMIN_PASSWORD: ${CKAN_SYSADMIN_PASSWORD:?Define CKAN_SYSADMIN_PASSWORD en .env}
  CKAN_SYSADMIN_EMAIL: ${CKAN_SYSADMIN_EMAIL:?Define CKAN_SYSADMIN_EMAIL en .env}
  CKAN_SMTP_SERVER: ${CKAN_SMTP_SERVER:-}
  CKAN_SMTP_USER: ${CKAN_SMTP_USER:-}
  CKAN_SMTP_PASSWORD: ${CKAN_SMTP_PASSWORD:-}
  CKAN_SMTP_MAIL_FROM: ${CKAN_SMTP_MAIL_FROM:-}
  CKANEXT__OGOVTECH__DIR3_CODE: ${CKANEXT__OGOVTECH__DIR3_CODE:-}
  CKANEXT__OGOVTECH__SPATIAL_URI: ${CKANEXT__OGOVTECH__SPATIAL_URI:-}
  CKANEXT__OGOVTECH__CATALOG_ISSUED: ${CKANEXT__OGOVTECH__CATALOG_ISSUED:-}
  # XLoader habla con CKAN por la red interna, sin pasar por el proxy.
  CKANEXT__XLOADER__SITE_URL: http://ckan:5000
  TZ: Europe/Madrid

services:
  ckan:
    image: ${CKAN_IMAGE:-ogov/ckan:baseline}
    build:
      context: ..
      dockerfile: docker/ckan/Dockerfile
      target: baseline
    platform: linux/amd64
    environment: *ckan-env
    depends_on:
      db: { condition: service_healthy }
      solr: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ckan_storage:/var/lib/ckan
      # Configuración propia de la instancia (p. ej. conector de transparencia)
      - ./config:/srv/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/api/3/action/status_show"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      start_interval: 10s
      retries: 5

  db:
    image: postgres:16.16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      CKAN_DB: ${CKAN_DB:?Define CKAN_DB en .env}
      CKAN_DB_USER: ${CKAN_DB_USER:?Define CKAN_DB_USER en .env}
      CKAN_DB_PASSWORD: ${CKAN_DB_PASSWORD:?Define CKAN_DB_PASSWORD en .env}
      DATASTORE_DB: ${DATASTORE_DB:?Define DATASTORE_DB en .env}
      DATASTORE_READONLY_USER: ${DATASTORE_READONLY_USER:?Define DATASTORE_READONLY_USER en .env}
      DATASTORE_READONLY_PASSWORD: ${DATASTORE_READONLY_PASSWORD:?Define DATASTORE_READONLY_PASSWORD en .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10

  solr:
    image: ckan/ckan-solr:2.12-solr9.9@sha256:c8208fdf5effd2bf692169d73cc53a1bdfe07988412810ace26cdb7a7b01373f
    platform: linux/amd64
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8983/solr/ckan/admin/ping"]
      interval: 15s
      retries: 10

  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  nginx:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      ckan: { condition: service_healthy }
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  ckan_storage:
  pg_data:
  solr_data:
