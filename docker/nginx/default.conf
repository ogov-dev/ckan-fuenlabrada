# Proxy inverso delante de CKAN. El TLS se termina aquí o en el balanceador
# del proveedor de infraestructura (responsabilidad del entorno).
upstream ckan { server ckan:5000; }

server {
    listen 80;
    server_name _;
    # Igual que ckan.max_resource_size (MB) en la imagen.
    client_max_body_size 100M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://ckan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
